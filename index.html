<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Анатомия: кости нижних конечностей</title>
<style>
:root{--ink:#0d2a4a;--mid:#3f6490;--blue:#1e6fd9;--sky:#dbeafe;--ice:#f2f8ff;--white:#fff;--line:#c4d9f2;--ok:#1a9a6b;--bad:#d9453b}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--ice);color:var(--ink);font:17px/1.55 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:var(--blue);color:#fff;padding:28px 20px 0}
.wrap{max-width:820px;margin:0 auto}
header h1{margin:0;font-size:1.7rem;line-height:1.2;letter-spacing:-.01em}
header p{margin:6px 0 18px;opacity:.88}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:1;min-width:max-content;border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:600;padding:11px 16px;border-radius:12px 12px 0 0;cursor:pointer}
nav button[aria-selected=true]{background:var(--ice);color:var(--blue)}
main{padding:22px 20px 60px}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
section[hidden]{display:none}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:1.08rem;color:var(--blue)}
.card p{margin:6px 0}
.tip{background:var(--sky);border-radius:10px;padding:9px 12px;margin:10px 0 0}
.say{border:1px solid var(--line);background:var(--ice);color:var(--blue);border-radius:999px;padding:5px 12px;font:inherit;font-size:.9rem;cursor:pointer;margin-top:8px}
.say:hover{background:var(--sky)}
.btn{border:0;background:var(--blue);color:#fff;font:inherit;font-weight:600;padding:11px 20px;border-radius:12px;cursor:pointer}
.btn.alt{background:var(--sky);color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.lat{font-style:italic;color:var(--mid)}
/* схемы */
.draw{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.draw{grid-template-columns:1.1fr 1fr}}
.pick{display:flex;gap:8px;margin-bottom:12px}
.pick button{border:1px solid var(--line);background:var(--white);color:var(--ink);font:inherit;padding:8px 16px;border-radius:999px;cursor:pointer}
.pick button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
svg{width:100%;height:auto;background:var(--white);border:1px solid var(--line);border-radius:16px}
.part{fill:#bcd7f7;stroke:var(--blue);stroke-width:2.5;cursor:pointer;transition:fill .15s}
.part:hover{fill:#8dbbf2}
.part.on{fill:var(--blue)}
.hole{fill:#fff}
svg text{font:600 13px "Segoe UI",Arial,sans-serif;fill:var(--ink);pointer-events:none}
#info h2{margin:0;font-size:1.3rem}
#info .empty{color:var(--mid)}
/* карточки и тест */
.flip{min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;font-size:1.35rem;font-weight:600}
.flip small{font-weight:400;font-size:.95rem;color:var(--mid);margin-top:8px;max-width:520px}
.bar{height:8px;background:var(--sky);border-radius:99px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.opt{display:block;width:100%;text-align:left;margin-top:8px;border:1.5px solid var(--line);background:var(--white);color:var(--ink);font:inherit;padding:12px 14px;border-radius:12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:#e5f7ef}
.opt.no{border-color:var(--bad);background:#fdeceb}
.meta{color:var(--mid);font-size:.92rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Кости нижних конечностей</h1>
<p>Пояс и свободная часть: шпаргалка, схемы, карточки, тест</p>
<nav role="tablist" id="tabs"></nav>
</div></header>
<main><div class="wrap">

<section id="t-cheat"></section>

<section id="t-draw" hidden>
<div class="pick" id="pick">
<button data-v="pelvis" aria-pressed="true">Тазовая кость</button>
<button data-v="femur" aria-pressed="false">Бедренная кость</button>
</div>
<div class="draw">
<div id="svgbox"></div>
<div class="card" id="info"><p class="empty">Нажми на часть кости на схеме: появятся название, латынь и пояснение, и голос их прочитает.</p></div>
</div>
<p class="meta">Схемы упрощённые, для понимания, где что находится. Подробные рисунки смотри в учебнике.</p>
</section>

<section id="t-cards" hidden>
<div class="meta" id="cprog"></div>
<div class="bar"><i id="cbar"></i></div>
<div class="card flip" id="flip" tabindex="0" role="button" aria-label="Перевернуть карточку"></div>
<div class="row">
<button class="btn alt" id="cflip">Перевернуть</button>
<button class="btn" id="cknow">Знаю</button>
<button class="btn alt" id="cagain">Ещё раз</button>
<button class="say" id="cspeak" style="margin:0">🔊 Озвучить</button>
<button class="btn alt" id="creset">Сбросить</button>
</div>
</section>

<section id="t-quiz" hidden></section>

</div></main>

<script>
/* ===== ДАННЫЕ. Новая тема = новый такой же блок ===== */
const D={
coxae:{ru:'Тазовая кость',lat:'os coxae',t:'Парная кость пояса нижней конечности. Состоит из подвздошной, лобковой и седалищной костей, которые срастаются в области вертлужной впадины. Две тазовые кости вместе с крестцом образуют таз.'},
ilium:{ru:'Подвздошная кость',lat:'os ilium',t:'Самая крупная из трёх костей таза. Состоит из тела и широкого крыла, верхний край которого называется подвздошным гребнем.'},
pubis:{ru:'Лобковая кость',lat:'os pubis',t:'Лежит спереди и внизу. Состоит из тела и двух ветвей, верхней и нижней. Спереди две лобковые кости соединяются лобковым симфизом.'},
ischium:{ru:'Седалищная кость',lat:'os ischii',t:'Лежит сзади и внизу. Состоит из тела и ветви. На ней находится седалищный бугор.'},
acetab:{ru:'Вертлужная впадина',lat:'acetabulum',t:'Глубокая впадина на наружной поверхности тазовой кости, в неё входит головка бедренной кости. В образовании впадины участвуют все три кости.'},
obtur:{ru:'Запирательное отверстие',lat:'foramen obturatum',t:'Большое отверстие между лобковой и седалищной костями. Почти целиком закрыто запирательной мембраной.'},
crest:{ru:'Подвздошный гребень',lat:'crista iliaca',t:'Верхний край крыла подвздошной кости. Хорошо прощупывается через кожу на боку, там, где обычно кладут руки на пояс.'},
tuber:{ru:'Седалищный бугор',lat:'tuber ischiadicum',t:'Утолщение на седалищной кости. Именно на него мы опираемся, когда сидим.'},
symph:{ru:'Лобковый симфиз',lat:'symphysis pubica',t:'Хрящевое соединение двух лобковых костей спереди, по средней линии тела.'},
incis:{ru:'Большая седалищная вырезка',lat:'incisura ischiadica major',t:'Крупная вырезка на заднем крае тазовой кости, на границе подвздошной и седалищной костей. Через неё проходят сосуды, нервы и грушевидная мышца.'},
auric:{ru:'Ушковидная поверхность',lat:'facies auricularis',t:'Поверхность подвздошной кости, которой она соединяется с крестцом (крестцово-подвздошный сустав).'},
femur:{ru:'Бедренная кость',lat:'femur',t:'Самая длинная и прочная трубчатая кость человека. Верхним концом входит в вертлужную впадину, нижним участвует в коленном суставе.'},
head:{ru:'Головка бедренной кости',lat:'caput femoris',t:'Шаровидная верхняя часть бедренной кости. Входит в вертлужную впадину и образует тазобедренный сустав. На ней есть ямка головки для связки.'},
neck:{ru:'Шейка бедренной кости',lat:'collum femoris',t:'Соединяет головку с телом, образуя с ним угол около 125–130°. Частое место перелома у пожилых людей.'},
gtroch:{ru:'Большой вертел',lat:'trochanter major',t:'Крупный бугор вверху и снаружи, хорошо прощупывается на боку бедра. К нему прикрепляются ягодичные мышцы.'},
ltroch:{ru:'Малый вертел',lat:'trochanter minor',t:'Небольшой бугор внизу и с внутренней стороны, ниже шейки. К нему прикрепляется подвздошно-поясничная мышца.'},
shaft:{ru:'Тело бедренной кости',lat:'corpus femoris',t:'Цилиндрическая часть, слегка изогнутая вперёд. Сзади на ней проходит шероховатая линия, место прикрепления мышц.'},
cond:{ru:'Мыщелки бедренной кости',lat:'condylus medialis et lateralis',t:'Два утолщения на нижнем конце кости, медиальный и латеральный. Сочленяются с большеберцовой костью. Между ними сзади лежит межмыщелковая ямка.'},
linea:{ru:'Шероховатая линия',lat:'linea aspera',t:'Гребень на задней поверхности тела бедренной кости, к нему прикрепляются мышцы бедра.'},
patella:{ru:'Надколенник',lat:'patella',t:'Самая крупная сесамовидная кость. Лежит в сухожилии четырёхглавой мышцы бедра и защищает коленный сустав спереди.'},
tibia:{ru:'Большеберцовая кость',lat:'tibia',t:'Толстая медиальная кость голени, несёт основную нагрузку. Внизу заканчивается медиальной лодыжкой.'},
fibula:{ru:'Малоберцовая кость',lat:'fibula',t:'Тонкая латеральная кость голени. Почти не несёт вес, служит для прикрепления мышц. Внизу заканчивается латеральной лодыжкой.'}
};

const CHEAT=[
{h:'Что относится к поясу, что к свободной части',b:'<p><b>Пояс нижней конечности</b>: парная тазовая кость.</p><p><b>Свободная часть</b>: бедренная кость, надколенник, кости голени (2) и кости стопы (26).</p><p>Всего на одной ноге 31 кость: 1 + 1 + 1 + 2 + 26.</p>',s:'К поясу нижней конечности относится парная тазовая кость. Свободная часть: бедренная кость, надколенник, две кости голени и двадцать шесть костей стопы. Всего на одной ноге тридцать одна кость.'},
{h:'Три кости, из которых сделана тазовая кость',b:'<p>Подвздошная, лобковая, седалищная. Срастаются у вертлужной впадины примерно к 14–16 годам.</p><div class="tip">💡 <b>Подвздошная</b> сверху: туда кладёшь руки на пояс. <b>Лобковая</b> спереди: рядом с лобком. <b>Седалищная</b> сзади-снизу: на ней сидишь.</div>',s:'Тазовая кость состоит из трёх костей: подвздошной, лобковой и седалищной. Подвздошная сверху, туда кладёшь руки на пояс. Лобковая спереди. Седалищная сзади и снизу, на ней сидишь.'},
{h:'Бедренная кость: что где',b:'<p>Сверху вниз: головка, шейка, вертелы, тело, мыщелки.</p><div class="tip">💡 <b>Большой вертел</b> большой и снаружи, его щупаешь на боку. <b>Малый вертел</b> маленький и спрятан внутри и ниже.</div><div class="tip">💡 Шейка бедра: угол с телом около 125–130°. Тупой, как раскрытая книга.</div>',s:'У бедренной кости сверху вниз: головка, шейка, вертелы, тело и мыщелки. Большой вертел большой и снаружи, его прощупываешь на боку. Малый вертел маленький и находится внутри и ниже.'},
{h:'Что с чем соединяется',b:'<p>Головка бедренной кости входит в вертлужную впадину: тазобедренный сустав.</p><p>Мыщелки бедра и большеберцовая кость: коленный сустав, спереди его закрывает надколенник.</p><p>Две лобковые кости спереди: лобковый симфиз. Подвздошная с крестцом: через ушковидную поверхность.</p>',s:'Головка бедренной кости входит в вертлужную впадину, это тазобедренный сустав. Мыщелки бедра и большеберцовая кость образуют коленный сустав, спереди его закрывает надколенник.'},
{h:'Что можно прощупать у себя',b:'<p>Подвздошный гребень на боку, большой вертел на боку ниже, седалищный бугор в положении сидя, надколенник и передний край большеберцовой кости.</p><p>Проверь на себе: так анатомия запоминается быстрее.</p>',s:'Прощупать у себя можно подвздошный гребень на боку, большой вертел ниже на боку, седалищный бугор в положении сидя, надколенник и передний край большеберцовой кости.'}
];

/* ===== УТИЛИТЫ ===== */
const $=s=>document.querySelector(s);
const ids=Object.keys(D);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function say(t){if(!('speechSynthesis' in window)){alert('Озвучка не поддерживается в этом браузере');return}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.95;speechSynthesis.speak(u)}
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ===== ВКЛАДКИ ===== */
const TABS=[['cheat','Шпаргалка'],['draw','Схемы'],['cards','Карточки'],['quiz','Тест']];
TABS.forEach(([k,n],i)=>{const b=document.createElement('button');b.role='tab';b.textContent=n;b.dataset.k=k;b.setAttribute('aria-selected',i==0);
b.onclick=()=>show(k);$('#tabs').append(b)});
function show(k){if('speechSynthesis' in window)speechSynthesis.cancel();
TABS.forEach(([x])=>{$('#t-'+x).hidden=x!=k});
document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k==k));
if(k=='quiz'&&!Q.on)startQuiz()}

/* ===== ШПАРГАЛКА ===== */
CHEAT.forEach((c,i)=>{const d=document.createElement('div');d.className='card';
d.innerHTML=`<h3>${c.h}</h3>${c.b}<button class="say" data-i="${i}">🔊 Послушать</button>`;$('#t-cheat').append(d)});
$('#t-cheat').onclick=e=>{const b=e.target.closest('.say');if(b)say(CHEAT[b.dataset.i].s)};

/* ===== СХЕМЫ ===== */
const SVG={
pelvis:`<svg viewBox="0 0 300 330" role="img" aria-label="Схема тазовой кости">
<path class="part" data-id="ilium" tabindex="0" d="M55 150C25 85 65 22 140 20C205 18 235 70 212 125L195 168L108 172Z"/>
<path class="part" data-id="pubis" tabindex="0" d="M112 195L45 232C36 243 48 258 66 254L132 226Z"/>
<path class="part" data-id="ischium" tabindex="0" d="M150 205L195 205C222 232 232 275 205 292C182 304 160 290 150 262L135 228Z"/>
<ellipse class="hole part" data-id="obtur" tabindex="0" cx="112" cy="262" rx="17" ry="24"/>
<circle class="part" data-id="acetab" tabindex="0" cx="150" cy="180" r="30" style="fill:#fff"/>
<path class="part" data-id="crest" tabindex="0" d="M55 150C25 85 65 22 140 20C205 18 235 70 212 125" fill="none" style="fill:none;stroke-width:9;stroke:#5a9be8"/>
<circle class="part" data-id="tuber" tabindex="0" cx="192" cy="286" r="12"/>
<text x="112" y="100">подвздошная</text><text x="52" y="238" style="font-size:11px">лобковая</text>
<text x="158" y="262" style="font-size:12px">седалищная</text><text x="122" y="184" style="font-size:11px">впадина</text>
</svg>`,
femur:`<svg viewBox="0 0 280 440" role="img" aria-label="Схема бедренной кости">
<rect class="part" data-id="shaft" tabindex="0" x="118" y="125" width="52" height="215" rx="14"/>
<line class="part" data-id="neck" tabindex="0" x1="78" y1="70" x2="138" y2="118" style="stroke-width:30;stroke-linecap:round;fill:none"/>
<circle class="part" data-id="head" tabindex="0" cx="66" cy="62" r="36"/>
<ellipse class="part" data-id="gtroch" tabindex="0" cx="160" cy="106" rx="28" ry="32"/>
<ellipse class="part" data-id="ltroch" tabindex="0" cx="112" cy="178" rx="13" ry="16"/>
<circle class="part" data-id="cond" tabindex="0" cx="100" cy="365" r="34"/>
<circle class="part" data-id="cond" tabindex="0" cx="188" cy="365" r="34"/>
<text x="36" y="66">головка</text><text x="186" y="110">большой вертел</text>
<text x="132" y="236">тело</text><text x="14" y="184" style="font-size:12px">малый вертел</text>
<text x="70" y="418">мыщелки</text>
</svg>`};
function drawView(v){$('#svgbox').innerHTML=SVG[v];
document.querySelectorAll('#pick button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==v));
$('#info').innerHTML='<p class="empty">Нажми на часть кости на схеме: появятся название, латынь и пояснение, и голос их прочитает.</p>'}
$('#pick').onclick=e=>{const b=e.target.closest('button');if(b)drawView(b.dataset.v)};
function pickPart(el){const d=D[el.dataset.id];if(!d)return;
document.querySelectorAll('.part.on').forEach(x=>x.classList.remove('on'));
if(el.dataset.id!='crest')el.classList.add('on');
$('#info').innerHTML=`<h2>${d.ru}</h2><div class="lat">${d.lat}</div><p>${d.t}</p><button class="say" id="again">🔊 Повторить</button>`;
$('#again').onclick=()=>say(d.ru+'. '+d.t);say(d.ru+'. '+d.t)}
$('#svgbox').onclick=e=>{const p=e.target.closest('.part');if(p)pickPart(p)};
$('#svgbox').onkeydown=e=>{if(e.key=='Enter'||e.key==' '){const p=e.target.closest('.part');if(p){e.preventDefault();pickPart(p)}}};
drawView('pelvis');

/* ===== КАРТОЧКИ ===== */
let known=new Set(store.get('known_lower',[])),queue=[],cur=null,flipped=false;
function buildQueue(){queue=shuffle(ids.filter(i=>!known.has(i)))}
function nextCard(){if(!queue.length)buildQueue();cur=queue[0]||null;flipped=false;renderCard()}
function renderCard(){const n=known.size,N=ids.length;
$('#cprog').textContent=`Выучено ${n} из ${N}`;$('#cbar').style.width=(n/N*100)+'%';
const f=$('#flip');
if(!cur){f.innerHTML='Все карточки выучены 🎉<small>Нажми «Сбросить», чтобы повторить.</small>';return}
const d=D[cur];
f.innerHTML=flipped?`<span class="lat">${d.lat}</span><small>${d.t}</small>`:`${d.ru}<small>Что это на латыни? Нажми, чтобы проверить.</small>`}
function flip(){if(cur){flipped=!flipped;renderCard()}}
$('#flip').onclick=flip;$('#cflip').onclick=flip;
$('#flip').onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();flip()}};
$('#cknow').onclick=()=>{if(!cur)return;known.add(cur);store.set('known_lower',[...known]);queue.shift();nextCard()};
$('#cagain').onclick=()=>{if(!cur)return;queue.push(queue.shift());nextCard()};
$('#cspeak').onclick=()=>{if(cur)say(D[cur].ru+'. '+D[cur].t)};
$('#creset').onclick=()=>{known=new Set();store.set('known_lower',[]);buildQueue();nextCard()};
buildQueue();nextCard();

/* ===== ТЕСТ ===== */
const Q={on:false,list:[],i:0,score:0};
function startQuiz(){Q.on=true;Q.i=0;Q.score=0;
Q.list=shuffle(ids).slice(0,8).map(id=>{const toLat=Math.random()<.5;
const wrong=shuffle(ids.filter(x=>x!=id)).slice(0,3);
return{id,toLat,opts:shuffle([id,...wrong])}});renderQ()}
function renderQ(){const s=$('#t-quiz');
if(Q.i>=Q.list.length){const p=Q.score/Q.list.length;
s.innerHTML=`<div class="card"><h3>Результат: ${Q.score} из ${Q.list.length}</h3><p>${p==1?'Без ошибок. Отлично!':p>=.6?'Неплохо. Ошибки лучше повторить на карточках.':'Пока рано. Пройди шпаргалку и карточки, потом пробуй снова.'}</p><div class="row"><button class="btn" id="qre">Пройти ещё раз</button></div></div>`;
$('#qre').onclick=startQuiz;return}
const q=Q.list[Q.i],d=D[q.id];
s.innerHTML=`<div class="meta">Вопрос ${Q.i+1} из ${Q.list.length}</div><div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
<div class="card"><h3>${q.toLat?`Как по-латыни: «${d.ru}»?`:`Что означает: <span class="lat">${d.lat}</span>?`}</h3><div id="opts"></div><p id="fb"></p><div class="row" id="nx"></div></div>`;
q.opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.dataset.o=o;
b.innerHTML=q.toLat?`<span class="lat">${D[o].lat}</span>`:D[o].ru;$('#opts').append(b)});
$('#opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;
const right=b.dataset.o==q.id;if(right)Q.score++;
document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o==q.id)x.classList.add('ok')});
if(!right)b.classList.add('no');
$('#fb').innerHTML=(right?'Верно. ':'Не совсем. ')+d.t;
$('#nx').innerHTML='<button class="btn" id="go">Дальше</button>';$('#go').onclick=()=>{Q.i++;renderQ()}}}
</script>
</body>
